[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azbot"
version = "0.2.0"
description = "AZBot: OpenAPI/MCP skill for ChatGPT, Grok, Venice, Claude, Cursor, Glama, and other assistants, plus a local runner for custom skills and Cursor SKILL.md files. Not a model. Not Grok weights."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Aziel Eliab"}]
requires-python = ">=3.10"
keywords = ["azbot", "skill", "grok", "mcp", "openapi", "cursor"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]

[project.scripts]
azbot = "azbot.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/AzielEliab/azbot"
Download = "https://azbot-download-tracker.vibelock.workers.dev/download?asset=azbot-0.2.0.tar.gz"

[tool.setuptools.packages.find]
include = ["azbot*"]

[tool.setuptools.package-data]
azbot = ["web/*", "SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
