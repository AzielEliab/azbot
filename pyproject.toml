[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azbot"
version = "0.1.0"
description = "AZBot: Grok/ChatGPT/Venice skill for Aziel Eliab public engines via aziel-runtime. Not a model."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Aziel Eliab"}]
requires-python = ">=3.10"
keywords = ["azbot", "skill", "grok", "mcp", "openapi"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]

[project.scripts]
azbot = "azbot.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/AzielEliab/azbot"
Download = "https://azbot-download-tracker.vibelock.workers.dev/download?asset=azbot-0.1.0.tar.gz"

[tool.setuptools.packages.find]
include = ["azbot*"]

[tool.setuptools.package-data]
azbot = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
